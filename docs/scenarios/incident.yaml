# C26 Incident, find and contain a host. Talk track: docs/scenarios/incident.md (with the epic).
scenario: 1
name: incident
title: Incident, find and contain a host
epic: 73
servers: [ise, catc, fmc]
pending: [ise_incident_response]   # ise I53
steps:
  - prompt: ise_incident_response
    calls: [ise_endpoint_360, catc_find_host, fmc_find_address, fmc_live_connections]
    leaves: [endpoint_mac, endpoint_ip, access_switch]
  - prompt: ise_incident_timeline
    needs: [endpoint_mac]
  - tool: ise_apply_anc
    needs: [endpoint_mac]
    leaves: [anc_policy_applied]
  - tool: fmc_contain_host
    needs: [endpoint_ip]
    leaves: [fmc_containment]
  - tool: catc_run_show_commands
    needs: [access_switch]
  - tool: ise_clear_anc
    needs: [anc_policy_applied]
  - tool: fmc_release_host
    needs: [fmc_containment]
requires:
  recipes: [ise-fmc-identity, catc-routers]
  fmc_device_slots: 1
