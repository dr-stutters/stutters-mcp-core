# Template (optional override): keep credentials out of .env and the container environment by mounting
# them as Docker secrets. Replace __SERVER__ and __ENV__ (e.g. ISE) as in docker-compose.yml.
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' 'the-appliance-password' > secrets/__SERVER___password
#   __SERVER__ token alice     # give alice the raw token; put the printed alice:sha256:... line in the file:
#   echo 'alice:sha256:...' >> secrets/__SERVER___auth_tokens
#   chmod 600 secrets/*
#   # remove __ENV___PASSWORD and MCP_AUTH_TOKENS from .env, then:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Inside the container the files appear under /run/secrets/ (mode 0444, owned by root; the server runs as
# uid 10001 and only reads them). Any SecretStr setting works the same way through <VAR>_FILE, and
# MCP_ROLES_FILE can be mounted like this too. `docker inspect` then shows only the file paths.
# Add `secrets/` to .gitignore (the dockerignore template already keeps it out of the build context).
services:
  __SERVER__:
    environment:
      __ENV___PASSWORD_FILE: /run/secrets/__SERVER___password
      MCP_AUTH_TOKENS_FILE: /run/secrets/__SERVER___auth_tokens
    secrets:
      - __SERVER___password
      - __SERVER___auth_tokens

secrets:
  __SERVER___password:
    file: ./secrets/__SERVER___password
  __SERVER___auth_tokens:
    file: ./secrets/__SERVER___auth_tokens
