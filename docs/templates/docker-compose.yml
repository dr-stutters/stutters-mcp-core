# Template: replace __SERVER__ (e.g. ise-mcp-server), __PORT__ (host port) and __ENV__ (e.g. ISE).
#
#   cp .env.example .env    # set __ENV___URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (__SERVER__ token <name>)
#   CORE_READ_TOKEN=... docker compose up -d --build
services:
  __SERVER__:
    build:
      context: .
      secrets:
        - core_read_token
    image: __SERVER__:latest
    container_name: __SERVER__
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
      # Optional event receivers (docs/adr/003-events.md); all off by default. Inside the container
      # they must listen on 0.0.0.0; choose the exposure with the host side of `ports` below.
      # MCP_SYSLOG_ENABLED: "true"
      # MCP_SYSLOG_HOST: 0.0.0.0
      # MCP_SYSLOG_UDP_PORT: "5514"
      # MCP_SYSLOG_TCP_PORT: "5514"
      # MCP_SYSLOG_ALLOW_IPS: "127.0.0.1/32,172.16.0.0/12"   # tunnel end / docker gateway / senders
      # MCP_WEBHOOKS_ENABLED: "true"            # secrets: MCP_WEBHOOK_SECRETS=<source>:<secret> in .env
      # MCP_WEBHOOK_HOST: 0.0.0.0
      # MCP_WEBHOOK_PORT: "8090"                # omit to serve /events/<source> on the MCP port instead
    ports:
      - "${MCP_PUBLISH_PORT:-__PORT__}:8000"
      # Event receivers. "127.0.0.1:" on the host side keeps them local: the SSH-tunnelled CML relay
      # (remote forwards land on cortex's loopback) still reaches them. Drop it to listen on all
      # host addresses. The relay carries TCP only, so use syslog over TCP through it.
      # - "127.0.0.1:${SYSLOG_PUBLISH_PORT:-5514}:5514/tcp"
      # - "127.0.0.1:${SYSLOG_PUBLISH_PORT:-5514}:5514/udp"
      # - "127.0.0.1:${WEBHOOK_PUBLISH_PORT:-8090}:8090"
    volumes:
      - spec-cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  core_read_token:
    environment: CORE_READ_TOKEN

volumes:
  spec-cache:
