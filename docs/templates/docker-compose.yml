# Template: replace __SERVER__ (e.g. ise-mcp-server), __PORT__ (host port) and __ENV__ (e.g. ISE).
#
#   cp .env.example .env    # set __ENV___URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (__SERVER__ token <name>)
#   docker compose up -d --build
#   (credentials as Docker secrets instead of .env: see docker-compose.secrets.yml)
services:
  __SERVER__:
    build:
      context: .
    image: __SERVER__:latest
    container_name: __SERVER__
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
    ports:
      - "${MCP_PUBLISH_PORT:-__PORT__}:8000"
    volumes:
      - spec-cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spec-cache:
