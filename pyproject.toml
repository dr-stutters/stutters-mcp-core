[project]
name = "stutters-mcp-core"
version = "0.16.1"
description = "Shared FastMCP foundation for the network MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dr-stutters", email = "drstuttersau@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
    # imported directly (mcp.types); same range as fastmcp's server extra, which is what pulls it in today
    "mcp>=2.0,<3",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# MCP background tasks (roadmap C12): MCP_TASKS=true; Docket backend in memory or Redis/Valkey
tasks = ["fastmcp-tasks>=4.1,<5"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "fastmcp-tasks>=4.1,<5",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = ["live: requires a reachable lab appliance (skipped otherwise)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]

[tool.mypy]
strict = true
files = ["src"]
