# Reusable CI for stutters-mcp-core and every server that depends on it.
#   jobs:
#     ci:
#       uses: dr-stutters/stutters-mcp-core/.github/workflows/python-ci.yml@main
#       with: {bundle-core: true}   # servers that bundle core (ADR-005); pair with bundle-core.yml
name: python-ci

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      audit:
        type: boolean
        default: true
        description: Run pip-audit on the locked runtime dependencies.
      bundle-core:
        type: boolean
        default: false
        description: Vendor the pinned core into src/<pkg>/_core first (scripts/bundle_core.py, ADR-005).
      audit-ignore:
        type: string
        default: ""
        description: Space-separated vulnerability ids to ignore (e.g. "GHSA-xxxx PYSEC-yyyy"), with a reason in the caller.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: ${{ inputs.python-version }}
      - name: Vendor the pinned core
        if: inputs.bundle-core
        run: python3 scripts/bundle_core.py vendor
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Dependency audit (pip-audit)
        if: inputs.audit
        env:
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
        run: |
          # Runtime dependencies from uv.lock, with hashes. A server that bundles core lists core's
          # dependencies itself; an older consumer's git dependency on core (no hash) is left out.
          uv export --no-dev --no-emit-project --no-emit-package stutters-mcp-core --frozen -q -o "$RUNNER_TEMP/requirements.txt"
          ignore=()
          for id in $AUDIT_IGNORE; do ignore+=(--ignore-vuln "$id"); done
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off --desc on "${ignore[@]}"
