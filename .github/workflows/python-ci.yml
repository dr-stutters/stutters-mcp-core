# Reusable CI for stutters-mcp-core and every server that depends on it.
#   jobs:
#     ci:
#       uses: dr-stutters/stutters-mcp-core/.github/workflows/python-ci.yml@main
#       secrets: inherit
name: python-ci

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      audit:
        type: boolean
        default: true
        description: Run pip-audit on the locked runtime dependencies.
      audit-ignore:
        type: string
        default: ""
        description: Space-separated vulnerability ids to ignore (e.g. "GHSA-xxxx PYSEC-yyyy"), with a reason in the caller.
    secrets:
      CORE_READ_TOKEN:
        description: Token able to read the private stutters-mcp-core repo (consumers only).
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow git dependencies on private repos
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        if: env.CORE_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Dependency audit (pip-audit)
        if: inputs.audit
        env:
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
        run: |
          # Runtime dependencies from uv.lock, with hashes. stutters-mcp-core is a git dependency (no hash);
          # its own dependencies are still listed and audited, and core's CI audits core.
          uv export --no-dev --no-emit-project --no-emit-package stutters-mcp-core --frozen -q -o "$RUNNER_TEMP/requirements.txt"
          ignore=()
          for id in $AUDIT_IGNORE; do ignore+=(--ignore-vuln "$id"); done
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off --desc on "${ignore[@]}"
