# Reusable release: on a v* tag, build sdist/wheel, attach them to a GitHub release and, when the
# caller has a Dockerfile and sets `image: true`, push ghcr.io/<owner>/<repo>:<version> and :latest.
# With `bundle-core: true` (ADR-005) the pinned core is vendored and drift-checked first; the wheel, the
# sdist and the image (built from the same vendored tree) then carry it as <pkg>._core.
name: python-release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: "runs-on label: ubuntu-latest (GitHub-hosted) or self-hosted (a runner the repository registered, e.g. for a private repo without Actions minutes)."
      image:
        type: boolean
        default: false
      bundle-core:
        type: boolean
        default: false
        description: Vendor the pinned core into the package before building (scripts/bundle_core.py).
      publish-pypi:
        type: boolean
        default: false   # ADR-001: git tags for now
      scan-severity:
        type: string
        default: "CRITICAL,HIGH"
        description: Trivy severities that fail the release (after the image is pushed; see docs/SUPPLY-CHAIN.md).
      scan-fail:
        type: boolean
        default: false
        description: Fail the workflow when Trivy finds fixable vulnerabilities at scan-severity (default report only).
      attest:
        type: boolean
        default: false
        description: Attach BuildKit provenance + SBOM attestations to the image (uses the docker-container builder).
      sign:
        type: boolean
        default: false   # cosign signing is ready but off until the key decision (docs/SUPPLY-CHAIN.md)

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - name: Vendor the pinned core and check for drift
        if: inputs.bundle-core
        run: |
          python3 scripts/bundle_core.py vendor
          git diff --exit-code -- pyproject.toml
          python3 scripts/bundle_core.py check
          uv lock --check
      - run: uv build
      - name: Check the bundled core in the built artifacts
        if: inputs.bundle-core
        run: python3 scripts/bundle_core.py check --offline --dist dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a re-run (or a release created by hand) gets its assets replaced.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            pre=(); [[ "${GITHUB_REF_NAME}" == *-* ]] && pre=(--prerelease)   # v1.2.0-rc1
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag "${pre[@]}"
          fi
      - name: Publish to PyPI
        if: inputs.publish-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Log in to GHCR
        if: inputs.image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Python SBOM (CycloneDX, from uv.lock)
        run: |
          uv export --no-dev --no-emit-project --no-emit-package stutters-mcp-core --frozen -q -o "$RUNNER_TEMP/requirements.txt"
          uvx --from cyclonedx-bom==7.1.0 cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" \
            --output-format JSON --output-file "dist/${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.python.cdx.json"
          gh release upload "${GITHUB_REF_NAME}" dist/*.cdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Image name
        if: inputs.image
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: inputs.image && inputs.attest
        uses: docker/setup-buildx-action@v3   # the default docker driver can't store attestations
      - name: Build and push image
        if: inputs.image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: ${{ inputs.attest && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attest }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
      - name: Image SBOM (SPDX, syft)
        if: inputs.image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image.spdx.json
          # The action's own artifact/release uploads need `actions: read`, which callers don't grant.
          upload-artifact: false
          upload-release-assets: false
      - name: Attach image SBOM to the release
        if: inputs.image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/image.spdx.json" "$RUNNER_TEMP/${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.image.spdx.json"
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.image.spdx.json" --clobber
      - name: Image scan (Trivy)
        if: inputs.image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: ${{ inputs.scan-fail && '1' || '0' }}
          format: table
      - name: Install cosign
        if: inputs.image && inputs.sign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (cosign, keyless via GitHub OIDC)
        if: inputs.image && inputs.sign
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
